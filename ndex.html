
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Third's Phone</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e7e0dc;
  color: #35312f;
}
.phone {
  max-width: 390px;
  min-height: 100vh;
  margin: auto;
  padding: 24px;
  box-sizing: border-box;
  background: linear-gradient(160deg, #d9e6dd, #f6e8e3);
}
h1 { font-size: 28px; }
.card {
  background: #ffffffbb;
  border-radius: 20px;
  padding: 18px;
  margin: 14px 0;
}
button {
  border: 0;
  border-radius: 14px;
  padding: 12px;
  margin: 4px;
  background: #8cae9c;
  color: white;
}
</style>
</head>
<body>
<div class="phone">
  <p>9:41　● Wi-Fi ▰</p>
  <h1>Third's Phone ♡</h1>
  <div class="card">
    <h2>เติร์ด จรัสเดชา</h2>
    <p>ยินดีต้อนรับสู่โทรศัพท์ของเติร์ด</p>
  </div>
  <div class="card">
    <button onclick="alert('ยังไม่มีข้อความใหม่ครับ ♡')">💬 Messages</button>
    <button onclick="alert('ยังไม่มีรูปภาพครับ')">🖼️ Photos</button>
    <button onclick="alert('เปิดเพลย์ลิสต์ของเติร์ด 🎵')">🎵 Music</button>
    <button onclick="alert('สวัสดีครับ!')">📱 Social</button>
  </div>
</div>
</body>
</html>
